# Block any commit that fails ruff (lint+format), mypy strict, or the
# test suites. Type hints are mandatory — enforced by ruff `ANN` rules +
# mypy `strict`. Tests run on every commit so CI is not needed.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: pytest-unit
        name: pytest (unit)
        entry: uv run pytest -m "not property and not memory and not integration and not slow"
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: pytest-property
        name: pytest (property — Hypothesis)
        entry: uv run pytest -m property
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: pytest-memory
        name: pytest (memory — memray)
        entry: uv run pytest --memray -m memory
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
