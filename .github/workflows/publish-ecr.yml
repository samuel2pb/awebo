name: Publish container to ECR

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Override image tag (defaults to git SHA + 'latest')"
        required: false

permissions:
  contents: read

concurrency:
  group: ecr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      AWS_ECR_REPO: ${{ vars.AWS_ECR_REPO }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate AWS_ECR_REPO
        run: |
          if [ -z "${AWS_ECR_REPO:-}" ]; then
            echo "::error::AWS_ECR_REPO repository variable is not set"
            exit 1
          fi
          if [ -z "${AWS_REGION:-}" ]; then
            echo "::error::AWS_REGION repository variable is not set"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          OVERRIDE="${{ github.event.inputs.tag }}"
          SHA_SHORT="${GITHUB_SHA::12}"
          if [ -n "$OVERRIDE" ]; then
            echo "tags=${AWS_ECR_REPO}:${OVERRIDE}" >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "${AWS_ECR_REPO}:latest"
              echo "${AWS_ECR_REPO}:${SHA_SHORT}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
