name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lint + format are enforced by pre-commit on each commit; CI runs the
# slower / environment-sensitive gates only (type-check + tests).
jobs:
  type-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Setup Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync env
        run: uv sync --all-extras

      - name: Mypy strict (src + tests)
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest -m "not property and not memory and not integration and not slow"
      - name: Property tests
        run: uv run pytest -m property
      - name: Memory tests
        run: uv run pytest --memray -m memory
