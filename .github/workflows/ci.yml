name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Setup Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync env
        run: uv sync --all-extras

      # Hard gates — type hints are mandatory.
      - name: Ruff lint (incl. ANN — annotations required)
        run: uv run ruff check src tests
      - name: Ruff format check
        run: uv run ruff format --check src tests
      - name: Mypy strict (src + tests)
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest -m "not property and not memory and not integration and not slow"
      - name: Property tests
        run: uv run pytest -m property
      - name: Memory tests
        run: uv run pytest --memray -m memory
