[project]
name = "awebo"
version = "0.1.0"
description = "DuckDB-powered data wrangler for Apache Iceberg lakehouses across multi-cloud catalogs."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Samuel Barbosa", email = "samuelpedropbarbosa@gmail.com" },
]
requires-python = ">=3.12"
keywords = ["iceberg", "duckdb", "lakehouse", "polars", "data", "aws", "glue"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "duckdb>=1.1.0",
    "pyiceberg[glue,s3fs,pyarrow]>=0.8.0",
    "pyarrow>=17.0.0",
    "polars>=1.0.0",
    "boto3>=1.34.0",
    "s3fs>=2024.6.0",
    "fsspec>=2024.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-memray>=1.7",
    "hypothesis>=6.100",
    "moto[s3,glue]>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.10",
    "types-boto3>=1.34",
]

[project.urls]
Homepage = "https://github.com/samuelpbarbosa/awebo"
Issues = "https://github.com/samuelpbarbosa/awebo/issues"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "SIM",              # simplify
    "RUF",              # ruff
    "PT",               # pytest
    "TID",              # tidy imports
    "PL",               # pylint
    "ANN",              # flake8-annotations — every def must be typed
    "FA",               # future annotations
    "TC",               # type-checking blocks
    "PYI",              # stub-style hint correctness
]
ignore = [
    "PLR0913",  # too many args (Lakehouse facade legitimately has many)
    "PLR2004",  # magic numbers in tests
    "PLC0415",  # lazy imports are intentional — keep import-time light
    "ANN401",   # Any is rejected via mypy `disallow_any_explicit` — ruff message is noisy
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "ANN201", "ANN001"]
"src/awebo/_version.py" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_any_generics = true
disallow_any_explicit = true
disallow_any_unimported = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
enable_error_code = ["redundant-self", "redundant-expr", "possibly-undefined", "truthy-bool"]
files = ["src/awebo", "tests"]

[[tool.mypy.overrides]]
# Packages without complete type stubs. duckdb / pyarrow / polars all ship
# `py.typed` so we let mypy follow them.
module = ["pyiceberg.*", "s3fs.*", "fsspec.*", "moto.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests use pytest fixtures + Hypothesis decorators heavily — relax `Any` rules
# in tests only, but keep `disallow_untyped_defs` so every test still types args.
module = ["tests.*"]
disallow_any_explicit = false
disallow_any_unimported = false
warn_return_any = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "property: Hypothesis property-based tests (run via `make test-prop`).",
    "memory: pytest-memray allocation tests (run via `make test-mem`).",
    "integration: hits real or mocked external services.",
    "slow: long-running tests, skipped by default in CI fast lane.",
]

[tool.coverage.run]
source = ["src/awebo"]
branch = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyarrow-stubs>=20.0.0.20251215",
    "pyiceberg[sql-sqlite]>=0.11.1",
]
